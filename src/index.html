<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f5f5">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/dist/output.css">
    <title>Sophopsy | A thoughtful space to grow</title>
</head>
<body class="min-h-screen p-2 lg:p-8 font-sans antialiased">
    <div class="site-frame mx-auto my-2 flex min-h-[calc(100vh-1rem)] max-w-screen flex-col overflow-hidden rounded-[24px] border border-black/10 bg-background dark:border-white/10">
        <header id="nav-shell" class="nav-shell relative z-20 w-full">
            <div class="mx-auto flex w-full max-w-[1460px] items-center justify-end gap-5 px-5 pt-6 sm:px-8 sm:pt-10 lg:px-0">
                <a class="hiring-pill" href="#approach">We are hiring!</a>
                <button id="nav-burger" class="nav-burger" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-menu">
                    <span></span><span></span><span></span>
                </button>
            </div>
            <div id="mobile-menu" class="mobile-menu" aria-label="Mobile navigation">
                <a href="#approach">Our approach</a>
                <a href="#support">Support</a>
                <a href="#stories">Stories</a>
            </div>
        </header>

        <main id="home" class="flex flex-1 flex-col">
            <section class="hero relative flex w-full flex-1 flex-col justify-end overflow-hidden" aria-labelledby="hero-title">
                <div class="hero-crosshair" aria-hidden="true">
                    <svg class="hero-spark" viewBox="0 0 362 400" focusable="false">
                        <path d="M181 0C181 200 181 200 362 200C181 200 181 200 181 400C181 200 181 200 0 200C181 200 181 200 181 0Z" fill="none" stroke="currentColor" stroke-width="1.2" />
                    </svg>
                </div>

                <div class="hero-content relative z-10 mx-auto grid w-full max-w-[1460px] items-end gap-9 px-5 pb-11 sm:px-8 lg:grid-cols-[1fr_300px_250px] lg:gap-8 lg:px-0 max-sm:flex-1 max-sm:grid-cols-1 max-sm:grid-rows-[auto_1fr_auto] max-sm:content-between max-sm:items-stretch max-sm:gap-4 max-sm:pb-5">
                    <h1 id="hero-title" class="hero-wordmark order-3 text-5xl font-bold tracking-[-0.03em] lg:order-none lg:text-7xl max-sm:self-end max-sm:text-[13vw] max-sm:leading-[0.92]">
                        Technology serving the Human Psyche
                    </h1>

                    <p class="hero-blurb order-2 max-sm:justify-self-end max-sm:self-end">Trusted guidance and support to help you grow &mdash; in your own language, on your own terms.</p>

                    <a id="support" class="promo-tile order-1 max-sm:justify-self-end max-sm:self-start max-sm:w-[min(42vw,240px)]" href="#approach">
                        <span class="promo-mark" aria-hidden="true"><i></i><i></i><i></i></span>
                        <span class="promo-name">Sophopsy</span>
                        <span class="promo-sub">Wellbeing</span>
                    </a>
                </div>

                <div class="relative z-10 mx-auto w-full max-w-[1460px] px-5 pb-9 sm:px-8 lg:px-0">
                    <div class="color-ribbon" aria-label="Sophopsy brand colors">
                        <span></span><span></span><span></span><span></span>
                    </div>
                </div>
            </section>
<!-- 
            <section id="approach" class="approach-preview mx-auto flex w-full max-w-[1180px] items-center justify-between gap-8 px-5 py-7 sm:px-8 lg:px-12" aria-label="Our approach">
                <p class="font-display text-lg font-semibold tracking-[-0.03em] text-foreground sm:text-xl">A little more clarity. A lot more possibility.</p>
                <a id="stories" class="approach-link hidden shrink-0 sm:inline-flex" href="#support">Discover Sophopsy <span aria-hidden="true">&nearr;</span></a>
            </section> -->
        </main>
    </div>
    <script src="./assets/js/main.js" defer></script>
</body>
</html>
